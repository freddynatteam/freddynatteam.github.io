<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gia Nhập - Freddy Nát Team</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>
<body>

<div class="scanlines"></div>

<section class="join-page">

  <h1 class="glitch"
  data-text="GIA NHẬP TEAM">
  GIA NHẬP TEAM
  </h1>

  <p class="join-sub">
    Bạn đủ bựa để gia nhập Freddy Nát Team chưa? 💀
  </p>

  <form class="join-form"
action="https://docs.google.com/forms/d/e/1FAIpQLSdxxxxxxxx/formResponse"
method="POST"
target="_blank">

  <input
  type="text"
  name="entry.111111111"
  placeholder="Tên của bạn"
  required>

  <input
  type="text"
  name="entry.222222222"
  placeholder="Discord/Facebook"
  required>

  <select
  name="entry.333333333"
  required>

    <option value="">
      Chọn role
    </option>

    <option>
      Editor
    </option>

    <option>
      Animator
    </option>

    <option>
      Voice Actor
    </option>

    <option>
      Meme Creator
    </option>

  </select>

  <textarea
  name="entry.444444444"
  placeholder="Bạn bựa cỡ nào?"
  rows="5"></textarea>

  <button type="submit"
  class="btn neon-btn">

    Gửi Đơn 💀

  </button>

</form>

  <a href="index.html"
  class="back-btn">
    ← Quay lại
  </a>

</section>

<script src="script.js"></script>

</body>
</html>
